  R.turnHead = function (tl, root, t, dx, dur) {

  };

  /* React: eyebrows up, eyes widen, then settle. */
  R.react = function (tl, root, t, hold) {

  };

  R.frown = function (tl, root, t, hold) {

  R.crowd = function (tl, uses, t0, dur, opt) {
